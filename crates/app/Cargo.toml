[package]
name = "testtracker-app"
version = "0.1.0"
description = "TestTracker desktop application"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "testtracker"
path = "src/main.rs"

[dependencies]
testtracker-core = { path = "../core" }
gpui-kit = { version = "=0.11.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
dirs = "7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
