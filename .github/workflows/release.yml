name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libzstd-dev
      - run: cargo build --release -p testtracker-app
      - name: Collect Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/testtracker artifacts/
      - name: Collect Windows artifact
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\release\testtracker.exe artifacts\
      - name: Collect macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp target/release/testtracker artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: testtracker-${{ matrix.os }}
          path: artifacts
          if-no-files-found: error
